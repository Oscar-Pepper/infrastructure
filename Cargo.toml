[workspace]
members = ["zcash_local_net", "zingo_common_components", "zingo_netutils", "zingo_test_vectors"]
resolver = "2"

[workspace.dependencies]
getset = "0.1.3"
hex = "0.4.3"
http = "1.1.0"
http-body-util = "0.1"
http-body = "1"
hyper-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
json = "0.12.4"
portpicker = "0.1.1"
prost = "0.13"
reqwest = "0.12.11"
rustls-pemfile = "2"
serde_json = "1.0.132"
sha2 = "0.10.8"
tempfile = "3.13.0"
thiserror = "1.0.64"
time = "0.3"
time-core = "0.1"
tokio = "1.42.0"
tokio-stream = "0.1.16"
tokio-rustls = "0.26"
tonic = { version = "0.13", features = [
    "tls-webpki-roots",
] }
tower = { version = "0.5" }
tracing = "0.1.40"
tracing-subscriber = "0.3.15"
webpki-roots = "0.25"

zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "d387aed7e04e881dbe30c6ff8b26a96c834c094b", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }
zcash_primitives = "0.24"
zcash_protocol = { version = "0.6", features = [
  "local-consensus",
] }

zebra-chain = { git = "https://github.com/zingolabs/zebra.git" , rev = "1168a2f391a17f3ccab65a095d9219b7455d0fea" }
zebra-node-services = { git = "https://github.com/zingolabs/zebra.git" , rev = "1168a2f391a17f3ccab65a095d9219b7455d0fea" }
zebra-rpc = { git = "https://github.com/zingolabs/zebra.git" , rev = "1168a2f391a17f3ccab65a095d9219b7455d0fea" }
